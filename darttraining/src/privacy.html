<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="theme-color" content="#0e1012">
<link rel="icon" type="image/png" href="{{root}}assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="{{root}}assets/icon-64.png" alt="" width="34" height="34">Darts Training</a>
    <a class="lang" href="{{other_lang_href}}privacy.html" hreflang="{{other_lang}}">{{other_lang}}</a>
  </div>
</header>

<main class="legal">
  <div class="wrap">
    <h1>{{h1}}</h1>
    <p class="updated">{{updated}}</p>
    {{body}}
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 {{rights}}</span>
    <a href="index.html">Darts Training</a>
    {{contact_link}}
  </div>
</footer>
</body>
</html>
